services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: family-meal-planner-backend
    ports:
      - "8000:8000"
    environment:
      - BACKEND_PERSISTENCE_MODE=inmemory
    volumes:
      - ./backend/app:/app/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: family-meal-planner-frontend
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
